name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-latest
          - goos: linux
            goarch: arm64
            runner: ubuntu-latest
          - goos: darwin
            goarch: amd64
            runner: macos-latest
          - goos: darwin
            goarch: arm64
            runner: macos-latest
          - goos: windows
            goarch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build (unix)
        if: matrix.goos != 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          commit='${{ needs.release-please.outputs.sha }}'
          test "$(git rev-parse HEAD)" = "$commit"
          go build -ldflags "-s -w -X main.version=${{ needs.release-please.outputs.version }} -X main.channel=stable -X main.commit=${commit} -X main.distribution=github" -o hand .
          host_goos=$(go env GOHOSTOS)
          host_goarch=$(go env GOHOSTARCH)
          if [ "$host_goos/$host_goarch" = "${{ matrix.goos }}/${{ matrix.goarch }}" ]; then
            ./hand build-info | grep -Fx "version: ${{ needs.release-please.outputs.version }}"
            ./hand build-info | grep -Fx "channel: stable"
            ./hand build-info | grep -Fx "commit: ${commit}"
            ./hand build-info | grep -Fx "distribution: github"
          fi
          tar czf hand-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz hand
      - name: Build (windows)
        if: matrix.goos == 'windows'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          commit='${{ needs.release-please.outputs.sha }}'
          test "$(git rev-parse HEAD)" = "$commit"
          go build -ldflags "-s -w -X main.version=${{ needs.release-please.outputs.version }} -X main.channel=stable -X main.commit=${commit} -X main.distribution=github" -o hand.exe .
          zip hand-${{ matrix.goos }}-${{ matrix.goarch }}.zip hand.exe
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: hand-${{ matrix.goos }}-${{ matrix.goarch }}
          path: hand-${{ matrix.goos }}-${{ matrix.goarch }}.*

  publish:
    name: Publish release assets
    needs: [release-please, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Prepare release-bound adoption assets
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
          RELEASE_VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -eu
          RELEASE_COMMIT='${{ needs.release-please.outputs.sha }}'
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          .github/scripts/prepare-release.sh "$RELEASE_TAG" "$RELEASE_VERSION" "$RELEASE_COMMIT" .
      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: |
            hand-*.tar.gz
            hand-*.zip
            bootstrap.sh
            bootstrap.ps1
            checksums.txt
          draft: true
          fail_on_unmatched_files: true
      - name: Verify complete draft before publication
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          set -eu
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" = true
          assets=$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          for asset in \
            hand-linux-amd64.tar.gz \
            hand-linux-arm64.tar.gz \
            hand-darwin-amd64.tar.gz \
            hand-darwin-arm64.tar.gz \
            hand-windows-amd64.zip \
            bootstrap.sh \
            bootstrap.ps1 \
            checksums.txt; do
            printf '%s\n' "$assets" | grep -Fx "$asset" >/dev/null
          done
      - name: Publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false
